<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背唐诗下五子棋 · 技术支持</title>
<style>
  :root {
    --ink: #3a3226;
    --muted: #8a7f6b;
    --paper: #faf6ec;
    --card: #ffffff;
    --accent: #9c6b3f;
    --line: #e8e0d0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; }
  header { text-align: center; margin-bottom: 40px; }
  header .seal {
    display: inline-block; width: 56px; height: 56px; line-height: 56px;
    background: var(--accent); color: #fff; border-radius: 8px;
    font-size: 28px; font-weight: 700; margin-bottom: 16px;
  }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 8px; }
  section {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 28px 28px; margin-bottom: 20px;
  }
  h2 { font-size: 18px; margin-bottom: 14px; color: var(--accent); }
  p { margin-bottom: 12px; font-size: 15px; }
  p:last-child { margin-bottom: 0; }
  .mail {
    display: inline-block; padding: 12px 22px; border-radius: 10px;
    background: #eef3e8; color: #4a6b3a; font-size: 17px; font-weight: 600;
    text-decoration: none; margin-top: 4px;
  }
  a { color: var(--accent); }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 32px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seal">诗</div>
    <h1>背唐诗下五子棋 · 技术支持</h1>
    <div class="sub">遇到问题？我们在这里帮你。</div>
  </header>

  <section>
    <h2>常见问题</h2>
    <p><b>游戏是单机吗？</b>是。本应用完全离线可玩，无需注册账号、无需联网。</p>
    <p><b>游戏进度会丢失吗？</b>进度（等级、经验、错题记录等）保存在设备本地。卸载应用会清除这些数据。</p>
    <p><b>支持哪些设备？</b>iPhone 与 iPad 均可运行。</p>
  </section>

  <section>
    <h2>联系我们</h2>
    <p>如果你在使用中遇到任何问题，或有任何建议，欢迎通过以下邮箱联系我们：</p>
    <p><a class="mail" href="mailto:46585112@qq.com">46585112@qq.com</a></p>
    <p style="margin-top:14px; color:var(--muted); font-size:14px;">我们会在看到邮件后尽快回复。</p>
  </section>

  <footer>
    <p>背唐诗下五子棋 · 技术支持页面</p>
  </footer>
</div>
</body>
</html>
